name: Actualizar reporte UV
on:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 17:30 Chile en horario de verano (hora UTC-3)
  workflow_dispatch: {}     # permite ejecutarlo a mano
permissions:
  contents: write
jobs:
  uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python generate_uv.py
        env:
          DMC_USER: ${{ secrets.DMC_USER }}
          DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
      - run: |
          git config user.name "uv-bot"
          git config user.email "uv-bot@users.noreply.github.com"
          git add docs
          git commit -m "UV $(date -u +%F)" || echo "sin cambios"
          git push
