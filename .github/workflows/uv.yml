name: Actualizar reporte UV

on:
  schedule:
    # Cada 30 min entre 11:00 y 23:59 UTC (aprox. 8:00 a 21:00 hora de Chile)
    - cron: "*/30 11-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-uv
  cancel-in-progress: false

jobs:
  uv:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Consultar Meteochile y generar reporte
        env:
          DMC_USER: ${{ secrets.DMC_USER }}
          DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
        run: python generate_uv.py

      - name: Guardar cambios
        run: |
          git config user.name "uv-bot"
          git config user.email "uv-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Actualizar reporte UV"
          git push
